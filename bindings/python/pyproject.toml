[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-strip-ansi"
version = "0.7.2"
description = "Python bindings for distill-strip-ansi"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]