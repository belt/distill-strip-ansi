# Project-scoped tool versions — managed by mise
#
# Install: mise install
# Verify:  mise ls
[tools]
"cargo:cargo-tarpaulin" = "latest"
"cargo:cargo-insta" = "latest"

# Supply-chain / binary-provenance (used by CI bootstrap + release).
# Note: cargo-audit/cargo-update/valgrind are expected to be installed by the
# distribution package manager on dev-host (pacman: cargo-audit,
# cargo-update, valgrind)
"cargo:cargo-deny" = "latest"
"cargo:cargo-auditable" = "latest"

# Deterministic benchmarking — instruction-count metrics via Cachegrind.
# Complements criterion wallclock benches; unaffected by CPU frequency,
# scheduling, or thermal noise. Useful for regression detection on
# sub-microsecond hot paths where criterion CV exceeds 5%.
#
# Requires valgrind installed system-wide (brew install valgrind on
# macOS with some caveats, apt install valgrind on Debian/Ubuntu).
"cargo:iai-callgrind-runner" = "latest"

[env]
CARGO_INCREMENTAL = "0"
RUST_BACKTRACE = "short"   # concise traces — full backtraces flood agent logs
NO_COLOR = "1"             # suppress ANSI in any tool that respects this
CARGO_TERM_COLOR = "never" # cargo: plain text output

# ── Local CI parity ──────────────────────────────────────────────
# Mirrors .github/workflows/ci.yml stages without docker/act.
# Run before push: mise run ci
#
# For release prep: mise run release:dry-run

# Usage: mise run ci:lockfiles
[tasks."ci:lockfiles"]
description = "Verify sub-workspace lockfiles are up-to-date"
run = """
set -e
cargo update --workspace --manifest-path fuzz/Cargo.toml
if ! git diff --quiet fuzz/Cargo.lock 2>/dev/null; then
  echo "err: fuzz/Cargo.lock is stale — commit the updated lockfile" >&2
  exit 1
fi
echo "ok: fuzz/Cargo.lock is current"
"""

# Usage: mise run ci
[tasks.ci]
description = "Full local CI gate (mirrors GitHub CI before push)"
# Both test suites are listed explicitly rather than collapsed into a
# --workspace run. Keeping them as two named steps preserves the
# package separation (see the "Test suites" block below) while still
# gating on both: separating the suites is about scope, not about
# letting the harness go unverified.
depends = ["fmt", "clippy", "deny", "ci:lockfiles", "test", "test:harness"]

# Usage: mise run release:dry-run
[tasks."release:dry-run"]
description = "CI gate + crates.io publish dry-run"
depends = ["ci", "msrv"]
run = """
set -e
cargo publish --dry-run --locked --allow-dirty
"""

# Usage: mise run fmt
[tasks.fmt]
description = "Format source code syntax"
run = """
cargo fmt --quiet --check
"""

# Usage: mise run msrv
[tasks.msrv]
description = "Verify compilation against minimum supported Rust version"
run = """
out=$(cargo test --locked --quiet 2>&1) || { echo "$out"; exit 1; }
echo "ok: msrv tests passed"
"""

# Usage: mise run deny
[tasks.deny]
description = "Audit dependencies for security and license compliance"
run = """
cargo deny --log-level warn check "$@"
"""

# Usage: mise run clippy
[tasks.clippy]
description = "Lint source code and verify test correctness"
run = """
env -u RUSTC_WORKSPACE_WRAPPER \
  cargo clippy --all-targets -- -D warnings
"""

# Usage: mise run lint-md
#
# Scoped to this repo, and target/ is excluded explicitly:
# markdownlint-cli2 does not read .gitignore
#
# markdownlint-cli2's negation syntax prints them # back as `!pattern`,
# uses `#pattern` because `!` needs quoting in most shells
[tasks.lint-md]
description = "Lint markdown files (this repo only, excludes target/)"
run = """
markdownlint-cli2 '**/*.md' '#target' '#**/target' "$@"
"""

# ══════════════════════════════════════════════════════════════════
# Test suites — TWO packages, TWO suites, deliberately separate
# ══════════════════════════════════════════════════════════════════
#
#   mise run test          → distill-strip-ansi   (the library)
#   mise run test:harness  → distill-bench-harness (bench tooling)
#   mise run test:all      → both packages
#
# The split is intentional. `test` proves the *published library* is
# correct and is what you run in a tight edit/test loop. The harness
# is measurement tooling that ships to nobody; its suite answers a
# different question ("is our benchmarking self-consistent?") and is
# kept out of the hot loop so the fast path stays fast.
#
# DO NOT "fix" `test` by adding --workspace. Package selection here is
# explicit (-p) precisely so that it reads as a decision rather than an
# oversight. If you want everything, that task already exists:
# `test:all`. Note also that --workspace does NOT pull benchmarks into
# the run — `[[bench]]` targets use harness = false and nextest ignores
# them — so "benchmarks are slow" is not the reason for the split, and
# adding --workspace would not have made `test` slow. The reason is
# scope: two packages, two questions.
#
# Both suites use --all-features so local runs match CI, which tests
# with --all-features. Without it ~135 feature-gated tests never run
# locally (565 vs 700 in the library package).

# Usage: mise run test
[tasks.test]
description = "Test the library package (distill-strip-ansi, all features)"
run = """
out=$(env -u RUSTC_WORKSPACE_WRAPPER \
  cargo nextest run -p distill-strip-ansi --all-features \
  --status-level skip --final-status-level fail "$@" 2>&1) || { echo "$out"; exit 1; }
echo "$out" | grep 'Summary' || echo "ok: tests passed"
"""

# Usage: mise run test:harness
#
# Self-audit for the benchmark tooling: cache/topology detection, the
# hardware-adaptive size ladder, and the criterion sample-size
# arithmetic. These are pure unit tests — fast, no benchmarks run.
# Kept runnable on its own so a change to benches/harness can be
# verified without a full workspace sweep.
[tasks."test:harness"]
description = "Test the bench harness package (distill-bench-harness)"
run = """
out=$(env -u RUSTC_WORKSPACE_WRAPPER \
  cargo nextest run -p distill-bench-harness --all-features \
  --status-level skip --final-status-level fail "$@" 2>&1) || { echo "$out"; exit 1; }
echo "$out" | grep 'Summary' || echo "ok: harness tests passed"
"""

# Usage: mise run test:all
[tasks."test:all"]
description = "Test every workspace package (library + bench harness)"
run = """
out=$(env -u RUSTC_WORKSPACE_WRAPPER \
  cargo nextest run --workspace --all-features \
  --status-level skip --final-status-level fail "$@" 2>&1) || { echo "$out"; exit 1; }
echo "$out" | grep 'Summary' || echo "ok: all tests passed"
"""

# Usage: mise run test-cargo
[tasks.test-cargo]
description = "Execute standard test suite"
run = """
env -u RUSTC_WORKSPACE_WRAPPER \
  cargo test "$@"
"""

# Usage: mise run coverage
[tasks.coverage]
description = "Generate test execution metrics"
run = """
env RUST_LOG=warn -u RUSTC_WRAPPER -u RUSTC_WORKSPACE_WRAPPER \
  cargo tarpaulin \
    --skip-clean \
    --target-dir target/tarpaulin \
    --engine llvm \
    --out html --out Xml \
    --output-dir target/tarpaulin \
    --post-test-delay 2 \
    -j 4 \
    -- --test-threads=1
"""

# Usage: mise run coverage:diff
[tasks."coverage:diff"]
description = "Enforce complete test coverage on new code changes"
depends = ["coverage"]
run = """
# We use uvx to fetch and run diff-cover invisibly
env uvx diff-cover target/tarpaulin/cobertura.xml --no-color --compare-branch=main --fail-under=95
"""

# Usage: mise run pgo
[tasks.pgo]
description = "Build with Profile-Guided Optimization (instrument → profile → rebuild)"
run = """
set -e
PGO_DIR="target/pgo-data"
rm -rf "$PGO_DIR"
mkdir -p "$PGO_DIR"

echo "==> Instrumenting..."
RUSTFLAGS="-Cprofile-generate=$PGO_DIR" \
  cargo build --release --quiet

echo "==> Collecting profiles..."
./target/release/strip-ansi < tests/fixtures/ansi-heavy.txt > /dev/null
./target/release/strip-ansi < tests/fixtures/docker-build.raw.txt > /dev/null
./target/release/strip-ansi < tests/fixtures/cargo-test.raw.txt > /dev/null
./target/release/distill-ansi < tests/fixtures/ansi-heavy.txt > /dev/null

echo "==> Merging profiles..."
llvm-profdata merge -o "$PGO_DIR/merged.profdata" "$PGO_DIR"

echo "==> Rebuilding with PGO..."
RUSTFLAGS="-Cprofile-use=$PGO_DIR/merged.profdata" \
  cargo build --release --quiet

echo "==> PGO build complete: target/release/strip-ansi"
"""

# Usage: mise run bench
#
# Default criterion run. For noise-free sub-microsecond numbers, see:
#   mise run bench:callgrind  (deterministic, instruction-count)
[tasks.bench]
description = "Run criterion benchmarks and regenerate doc/BENCHMARKS.md"
run = """
./bin/bench-run.sh bench "$@"
"""

# Usage: mise run bench:quick
[tasks."bench:quick"]
description = "Fast criterion pass (lower statistical power — do NOT publish)"
run = """
BENCH_QUICK=1 ./bin/bench-run.sh bench-quick "$@"
"""

# Usage: mise run bench:callgrind
#
# iai-callgrind runs benches under Callgrind: instruction counts,
# L1/LL cache accesses, branch mispredicts. Zero variance run-to-run
# on a given ISA — right tool when criterion CV > 5% or CI regression gates
# are not flaky.
# 
# Requires `valgrind` on PATH. Install via system package manager.
#
# Drives the generator in iai mode so both `BENCHMARKS.md` and
# `BENCHMARKS-REPRODUCE.md` get regenerated with `Ir/MiB` columns
# (where applicable) and up-to-date environment info.
[tasks."bench:callgrind"]
description = "Deterministic instruction-count benchmarks via iai-callgrind"
# The generator itself preflights valgrind and exits before running
# anything, so this task no longer duplicates that check — one source
# of truth for the requirement.
run = """
./bin/bench-run.sh bench-callgrind --features iai-callgrind "$@"
"""

# Usage: mise run bench:publish
#
# The canonical run for numbers that ship: criterion plus deterministic
# Ir counts, capped at 64 MiB. This is the invocation that produced the
# figures currently in doc/BENCHMARKS.md and the README performance
# block, recorded here so it stops being retyped by hand.
#
# --max-size 64M applies to the criterion ladder only; the iai pass
# uses its own fixed size tiers. 64 MiB is 8x this host's L3, which is
# far enough past cache to show the DRAM-bound plateau without paying
# for the GiB-scale tiers.
#
# Expect ~45 minutes and an idle machine. Wall-clock benches are
# serial by necessity; only the callgrind pass runs concurrently
# (see --iai-jobs).
[tasks."bench:publish"]
description = "Canonical release benchmark run (criterion + Ir, 64 MiB cap)"
run = """
./bin/bench-run.sh bench-publish --features iai-callgrind --max-size 64M "$@"
"""

# Usage: mise run tools:update
#
# Snapshot of cargo-installed tools against crates.io. `cargo
# install-update -a` applies updates; `-l` is a dry-run.
# `cargo-update` itself comes from the distribution package
# manager on this host (pacman: cargo-update), not from mise.
[tasks."tools:update"]
description = "Check cargo install-update against latest crates.io versions"
run = """
if ! command -v cargo-install-update >/dev/null 2>&1; then
  echo 'err: cargo-update not installed. Check distro package manager' >&2
  exit 1
fi
cargo install-update -l
"""
